<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <!-- Background Glow Gradient -->
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F85606" />
      <stop offset="50%" stop-color="#FF7A00" />
      <stop offset="100%" stop-color="#FFB800" />
    </linearGradient>

    <!-- Cart Body Gradient -->
    <linearGradient id="cartBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Canopy Stripes Gradient -->
    <linearGradient id="canopyLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FFF1E6" />
    </linearGradient>

    <linearGradient id="canopyRed" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F85606" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Neon Wheel Rim Gradient -->
    <linearGradient id="neonRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF9E00" />
      <stop offset="100%" stop-color="#F85606" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F85606" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Outer Rounded Glowing App Icon Container -->
  <rect x="8" y="8" width="144" height="144" rx="36" fill="url(#bgGlow)" filter="url(#glow)"/>
  <rect x="11" y="11" width="138" height="138" rx="33" fill="#090D16" stroke="url(#bgGlow)" stroke-width="1.5" stroke-opacity="0.6"/>

  <!-- Subtle Radial Spotlight inside container -->
  <circle cx="80" cy="80" r="60" fill="#F85606" fill-opacity="0.08" />

  <!-- Steam Aromas Rising from Food Cart -->
  <path d="M56 42 Q53 34 58 27 Q63 20 59 15" stroke="#FFA800" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <animate attributeName="d" values="M56 42 Q53 34 58 27 Q63 20 59 15; M56 42 Q59 34 54 27 Q49 20 55 15; M56 42 Q53 34 58 27 Q63 20 59 15" dur="3s" repeatCount="indefinite" />
  </path>
  <path d="M80 39 Q84 31 79 24 Q74 17 81 12" stroke="#FF5400" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.95">
    <animate attributeName="d" values="M80 39 Q84 31 79 24 Q74 17 81 12; M80 39 Q76 31 81 24 Q86 17 79 12; M80 39 Q84 31 79 24 Q74 17 81 12" dur="2.5s" repeatCount="indefinite" />
  </path>
  <path d="M104 42 Q101 34 106 27 Q111 20 107 15" stroke="#FFA800" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.85">
    <animate attributeName="d" values="M104 42 Q101 34 106 27 Q111 20 107 15; M104 42 Q107 34 102 27 Q97 20 103 15; M104 42 Q101 34 106 27 Q111 20 107 15" dur="3.2s" repeatCount="indefinite" />
  </path>

  <!-- Modern Striped Food Cart Canopy (Roof) -->
  <path d="M26 66 L36 44 Q38 40 43 40 L117 40 Q122 40 124 44 L134 66 Z" fill="url(#canopyLight)"/>
  <!-- Canopy Red Stripes -->
  <path d="M43 40 L36 66 L52 66 L55 40 Z" fill="url(#canopyRed)"/>
  <path d="M72 40 L70 66 L90 66 L88 40 Z" fill="url(#canopyRed)"/>
  <path d="M105 40 L108 66 L124 66 L117 40 Z" fill="url(#canopyRed)"/>

  <!-- Scalloped Canopy Valance Front -->
  <path d="M26 66 Q31 73 36 66 Q41 73 46 66 Q51 73 56 66 Q61 73 66 66 Q71 73 76 66 Q81 73 86 66 Q91 73 96 66 Q101 73 106 66 Q111 73 116 66 Q121 73 126 66 Q131 73 134 66" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round"/>

  <!-- Food Cart Service Counter & Window Shelf -->
  <rect x="34" y="68" width="92" height="6" rx="3" fill="#FFA800" />

  <!-- Burger on Counter Display -->
  <path d="M73 66 Q80 61 87 66 Z" fill="#F59E0B" />
  <rect x="72" y="66" width="16" height="2" rx="1" fill="#10B981" />
  <rect x="71" y="68" width="18" height="2.5" rx="1.2" fill="#78350F" />
  <path d="M73 70.5 Q80 73 87 70.5 Z" fill="#F59E0B" />

  <!-- Main Food Cart Trailer Body -->
  <rect x="36" y="74" width="88" height="38" rx="8" fill="url(#cartBody)" stroke="#334155" stroke-width="1.5" />

  <!-- Neon Brand Badge on Cart Body -->
  <rect x="46" y="81" width="68" height="18" rx="6" fill="#0B132B" stroke="url(#neonRim)" stroke-width="1.5" />
  <text x="80" y="93.5" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-weight="900" font-size="8.5" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.8">
    FOOD CART
  </text>
  <circle cx="51" cy="90" r="1.8" fill="#F85606" />
  <circle cx="109" cy="90" r="1.8" fill="#F85606" />

  <!-- Cart Handle and Leg Stand -->
  <path d="M124 82 L132 82 L132 94 L124 94" stroke="#64748B" stroke-width="2" stroke-linecap="round" fill="none"/>
  <path d="M42 112 L42 124 L38 126" stroke="#64748B" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Left Cart Wheel -->
  <circle cx="58" cy="116" r="15" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <circle cx="58" cy="116" r="12" fill="#1E293B" stroke="url(#neonRim)" stroke-width="2"/>
  <circle cx="58" cy="116" r="5" fill="#FF7A00"/>
  <circle cx="58" cy="116" r="2" fill="#FFFFFF"/>
  <line x1="58" y1="104" x2="58" y2="128" stroke="#64748B" stroke-width="1.5"/>
  <line x1="46" y1="116" x2="70" y2="116" stroke="#64748B" stroke-width="1.5"/>

  <!-- Right Cart Wheel -->
  <circle cx="102" cy="116" r="15" fill="#0F172A" stroke="#334155" stroke-width="2.5"/>
  <circle cx="102" cy="116" r="12" fill="#1E293B" stroke="url(#neonRim)" stroke-width="2"/>
  <circle cx="102" cy="116" r="5" fill="#FF7A00"/>
  <circle cx="102" cy="116" r="2" fill="#FFFFFF"/>
  <line x1="102" y1="104" x2="102" y2="128" stroke="#64748B" stroke-width="1.5"/>
  <line x1="90" y1="116" x2="114" y2="116" stroke="#64748B" stroke-width="1.5"/>

  <!-- Ground Shadow -->
  <ellipse cx="80" cy="135" rx="55" ry="4" fill="#000000" fill-opacity="0.45" />

  <!-- Sparkling Innovation Star Top Right -->
  <polygon points="128,24 130,29 135,31 130,33 128,38 126,33 121,31 126,29" fill="#FFF1E6" />
</svg>
